name: Release

# Plain "v1.3.4" tags only. The installed apps compare the tag with their own
# version, and a platform prefix (win-v1.3.4) reads as no version at all to the
# builds already on people's machines — they then never offer the update.
# The job below still rebuilds only the platforms whose files changed, so each
# card on the site keeps its own version and tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.1.0"
        required: true

permissions:
  contents: write

env:
  ELECTRON_CACHE: ~/.cache/electron
  ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

jobs:
  changes:
    name: Platforms in this tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      windows: ${{ steps.meta.outputs.windows }}
      tv: ${{ steps.meta.outputs.tv }}
      mobile: ${{ steps.meta.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what this tag rebuilds
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            windows=true; tv=true; mobile=true
          else
            PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
            if [ -z "$PREV" ]; then
              CHANGED="$(git ls-tree -r --name-only HEAD)"
            else
              CHANGED="$(git diff --name-only "$PREV" "$GITHUB_SHA")"
            fi
            if grep -q '^windows/' <<< "$CHANGED"; then windows=true; else windows=false; fi
            if grep -q '^android/' <<< "$CHANGED"; then android=true; else android=false; fi
            tv="$android"
            mobile="$android"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "tv=$tv" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "$TAG -> $VERSION (windows=$windows tv=$tv mobile=$mobile)"

  android:
    name: Android APKs
    needs: changes
    if: needs.changes.outputs.tv == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      # Signing material comes from repository secrets. Without it the release
      # APK would be unsigned, so the build stops here instead of shipping one.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing — refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/zenktx-release.jks
          {
            echo "storeFile=zenktx-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "certSha256=$CERT_SHA256"
          } > android/keystore.properties

      # versionCode is derived from the version (1.1.0 -> 10100) so it always
      # increases across releases; the tag decides which flavours run.
      - name: Build requested release APKs
        working-directory: android
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          BUILD_TV: ${{ needs.changes.outputs.tv }}
          BUILD_MOBILE: ${{ needs.changes.outputs.mobile }}
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          TASKS=""
          if [ "$BUILD_TV" = "true" ]; then TASKS="$TASKS assembleTvRelease"; fi
          if [ "$BUILD_MOBILE" = "true" ]; then TASKS="$TASKS assembleMobileRelease"; fi
          echo "Building $VERSION (versionCode $CODE):$TASKS"
          ./gradlew --no-daemon $TASKS -PversionName="$VERSION" -PversionCode="$CODE"

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          BUILD_TV: ${{ needs.changes.outputs.tv }}
          BUILD_MOBILE: ${{ needs.changes.outputs.mobile }}
        run: |
          mkdir -p out
          if [ "$BUILD_TV" = "true" ]; then
            cp android/app/build/outputs/apk/tv/release/app-tv-release.apk "out/ZENKTX-TV-${VERSION}.apk"
          fi
          if [ "$BUILD_MOBILE" = "true" ]; then
            cp android/app/build/outputs/apk/mobile/release/app-mobile-release.apk "out/ZENKTX-Mobile-${VERSION}.apk"
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    # Set WIN_CERT_PFX_BASE64 (base64 of the .pfx) and WIN_CERT_PASSWORD to sign
    # both executables. Without them the job still builds, but unsigned.
    env:
      CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: windows
        run: npm install --no-audit --no-fund

      - name: Set version from tag
        working-directory: windows
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build installer and portable exe
        working-directory: windows
        run: npm run dist

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp windows/dist/*.exe out/ || true
          ls -lh out

      - name: Verify Authenticode signatures
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem out/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} - {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { throw "Signing ran but the signature is not valid." }

      - name: Signing skipped
        if: env.CSC_LINK == ''
        run: echo "::warning::WIN_CERT_PFX_BASE64 is not set, so the executables ship unsigned."

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: out/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [changes, android, windows]
    # One platform is skipped on purpose here, so success() alone is false.
    if: >-
      always() &&
      needs.android.result != 'failure' && needs.android.result != 'cancelled' &&
      needs.windows.result != 'failure' && needs.windows.result != 'cancelled' &&
      (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect files
        run: |
          mkdir -p release
          find dist -type f \( -name "*.apk" -o -name "*.exe" \) -exec cp {} release/ \;
          ls -lh release

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Only the platforms this tag rebuilt get a row, so the notes never claim a
      # new Android build on a Windows-only release.
      - name: Compose release notes
        env:
          VERSION: ${{ needs.changes.outputs.version }}
          TV: ${{ needs.changes.outputs.tv }}
          MOBILE: ${{ needs.changes.outputs.mobile }}
          WINDOWS: ${{ needs.changes.outputs.windows }}
        shell: bash
        run: |
          {
            echo "## ZENKTX TV Stream $VERSION"
            echo
            echo "| Platform | Asset |"
            echo "| --- | --- |"
            if [ "$TV" = "true" ]; then
              echo "| Android TV (7.0+) | \`ZENKTX-TV-$VERSION.apk\` |"
            fi
            if [ "$MOBILE" = "true" ]; then
              echo "| Android mobile (7.0+) | \`ZENKTX-Mobile-$VERSION.apk\` |"
            fi
            if [ "$WINDOWS" = "true" ]; then
              echo "| Windows 10/11 x86_64 (installer) | \`ZENKTX-Setup-$VERSION.exe\` |"
              echo "| Windows 10/11 x86_64 (portable) | \`ZENKTX-Portable-$VERSION.exe\` |"
            fi
            echo
            echo "Only the platforms edited in this tag are rebuilt; the others keep their"
            echo "previous release, so their updater stays quiet until their code changes."
            if [ "$TV" = "true" ] || [ "$MOBILE" = "true" ]; then
              echo "Every APK is signed with the ZENKTX release certificate."
            fi
            if [ "$WINDOWS" = "true" ]; then
              echo "The Windows executables are signed only when the certificate secrets are configured."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ZENKTX TV Stream ${{ needs.changes.outputs.version }}
          tag_name: ${{ steps.tag.outputs.name }}
          draft: false
          generate_release_notes: false
          body_path: release-notes.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
