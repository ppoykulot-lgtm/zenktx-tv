name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.1.0"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  ELECTRON_CACHE: ~/.cache/electron
  ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

jobs:
  # A tag only rebuilds the platforms whose files it changed: an Android edit
  # must not republish the Windows installers, and the other way round. Each
  # updater looks for its own asset, so a single-platform release still works.
  changes:
    name: Changed platforms
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against the previous tag
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "No previous tag, treating every platform as changed."
            CHANGED="$(git ls-tree -r --name-only HEAD)"
          else
            echo "Comparing $PREV..$GITHUB_SHA"
            CHANGED="$(git diff --name-only "$PREV" "$GITHUB_SHA")"
          fi
          if grep -q '^android/' <<< "$CHANGED"; then android=true; else android=false; fi
          if grep -q '^windows/' <<< "$CHANGED"; then windows=true; else windows=false; fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "Android: $android  Windows: $windows"

  android:
    name: Android APKs
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      # Signing material comes from repository secrets. Without it the release
      # APK would be unsigned, so the build stops here instead of shipping one.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing — refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/zenktx-release.jks
          {
            echo "storeFile=zenktx-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "certSha256=$CERT_SHA256"
          } > android/keystore.properties

      # The tag is "v1.1.0" but the asset names must be "1.1.0" so the landing
      # page and the in-app updater can find them. versionCode is derived from
      # the version (1.1.0 -> 10100) so it always increases across releases.
      - name: Build TV + mobile release APKs
        working-directory: android
        env:
          RAW_VERSION: ${{ env.VERSION }}
        run: |
          VERSION="${RAW_VERSION#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Building $VERSION (versionCode $CODE)"
          ./gradlew --no-daemon assembleTvRelease assembleMobileRelease \
            -PversionName="$VERSION" \
            -PversionCode="$CODE"

      - name: Collect artifacts
        env:
          RAW_VERSION: ${{ env.VERSION }}
        run: |
          VERSION="${RAW_VERSION#v}"
          mkdir -p out
          cp android/app/build/outputs/apk/tv/release/app-tv-release.apk "out/ZENKTX-TV-${VERSION}.apk"
          cp android/app/build/outputs/apk/mobile/release/app-mobile-release.apk "out/ZENKTX-Mobile-${VERSION}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    # Set WIN_CERT_PFX_BASE64 (base64 of the .pfx) and WIN_CERT_PASSWORD to sign
    # both executables. Without them the job still builds, but unsigned.
    env:
      CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: windows
        run: npm install --no-audit --no-fund

      - name: Set version from tag
        working-directory: windows
        shell: bash
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Build installer and portable exe
        working-directory: windows
        run: npm run dist

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp windows/dist/*.exe out/ || true
          ls -lh out

      - name: Verify Authenticode signatures
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem out/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} - {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { throw "Signing ran but the signature is not valid." }

      - name: Signing skipped
        if: env.CSC_LINK == ''
        run: echo "::warning::WIN_CERT_PFX_BASE64 is not set, so the executables ship unsigned."

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: out/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [changes, android, windows]
    # One platform is skipped on purpose here, so success() alone is false.
    if: >-
      always() &&
      needs.android.result != 'failure' && needs.android.result != 'cancelled' &&
      needs.windows.result != 'failure' && needs.windows.result != 'cancelled' &&
      (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect files
        run: |
          mkdir -p release
          find dist -type f \( -name "*.apk" -o -name "*.exe" \) -exec cp {} release/ \;
          ls -lh release

      # Only the platform this tag rebuilt gets a row, so the notes never claim a
      # new Android build on a Windows-only release.
      - name: Compose release notes
        env:
          ANDROID: ${{ needs.changes.outputs.android }}
          WINDOWS: ${{ needs.changes.outputs.windows }}
        shell: bash
        run: |
          V="${VERSION#v}"
          {
            echo "## ZENKTX TV Stream $V"
            echo
            echo "| Platform | Asset |"
            echo "| --- | --- |"
            if [ "$ANDROID" = "true" ]; then
              echo "| Android TV (7.0+) | \`ZENKTX-TV-$V.apk\` |"
              echo "| Android Mobile (7.0+) | \`ZENKTX-Mobile-$V.apk\` |"
            fi
            if [ "$WINDOWS" = "true" ]; then
              echo "| Windows 10/11 x86_64 (installer) | \`ZENKTX-Setup-$V.exe\` |"
              echo "| Windows 10/11 x86_64 (portable) | \`ZENKTX-Portable-$V.exe\` |"
            fi
            echo
            echo "Only the platforms edited in this tag are rebuilt; the others keep their"
            echo "previous release, so their updater stays quiet until their code changes."
            if [ "$ANDROID" = "true" ]; then
              echo "Every APK is signed with the ZENKTX release certificate."
            fi
            if [ "$WINDOWS" = "true" ]; then
              echo "The Windows executables are signed only when the certificate secrets are configured."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ZENKTX TV Stream ${{ steps.v.outputs.version }}
          tag_name: v${{ steps.v.outputs.version }}
          draft: false
          generate_release_notes: false
          body_path: release-notes.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
