<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ZENKTX TV Stream — brand sheet</title>
<style>
  :root{--bg:#060911;--mint:#35E7C0;--muted:#8B98B4;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(91,140,255,.16), transparent 60%),
      radial-gradient(700px 460px at 0% 110%, rgba(53,231,192,.10), transparent 60%),
      var(--bg);
    min-height:100vh;display:grid;place-items:center;
    font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif;color:#F2F5FF;
  }
  .sheet{width:1040px;padding:44px 0}
  .row{display:flex;align-items:center;gap:56px}
  .lockup img{width:620px;display:block}
  .mark img{width:190px;display:block}
  .label{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:26px;font-weight:700}
  .swatches{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
  .sw{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.5px}
  .sw i{width:26px;height:26px;border-radius:8px;display:block;border:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
  <div class="sheet">
    <div class="row">
      <div class="lockup"><img src="zenktx-logo.svg" alt="ZENKTX TV Stream" /></div>
      <div class="mark"><img src="zenktx-mark.svg" alt="ZENKTX mark" /></div>
    </div>
    <div class="label">LOGO — MARK + LOCKUP</div>
    <div class="swatches">
      <span class="sw"><i style="background:#060911"></i>#060911 bg</span>
      <span class="sw"><i style="background:#111A2B"></i>#111A2B surface</span>
      <span class="sw"><i style="background:#35E7C0"></i>#35E7C0 mint</span>
      <span class="sw"><i style="background:#5B8CFF"></i>#5B8CFF blue</span>
      <span class="sw"><i style="background:#F2F5FF"></i>#F2F5FF text</span>
    </div>
  </div>
</body>
</html>
