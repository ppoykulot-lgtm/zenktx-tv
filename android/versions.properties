# One version line per app.
#
# Android TV and Android Mobile are two separate apps with separate release
# cadences: a change to the TV grid must not hand the phone a new number (and a
# new download) it never earned. Bump only the line you actually changed.
#
# Rules:
#  - versionName must be higher than every tag already published (tags are
#    shared between the two apps, so a number cannot be used twice), even when
#    the other app had a higher one. 1.5.7 (tv) then 1.5.8 (mobile) is fine.
#  - versionCode is derived from versionName by the release workflow
#    (1.5.7 -> 10507) and only needs to grow for the app being bumped; keep the
#    two values in sync so a local build reports the same code as CI.
tv.versionName=1.5.7
tv.versionCode=10507
mobile.versionName=1.5.7
mobile.versionCode=10507
