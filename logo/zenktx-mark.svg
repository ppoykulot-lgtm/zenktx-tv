<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ZENKTX TV Stream mark">
  <defs>
    <linearGradient id="zkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A2E"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="zkMint" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#59FFD8"/>
      <stop offset="0.5" stop-color="#35E7C0"/>
      <stop offset="1" stop-color="#1FBFD9"/>
    </linearGradient>
    <linearGradient id="zkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BA6FF"/>
      <stop offset="1" stop-color="#4B6BFF"/>
    </linearGradient>
    <radialGradient id="zkGlow" cx="0.5" cy="0.35" r="0.62">
      <stop offset="0" stop-color="#35E7C0" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#35E7C0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#35E7C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#zkBg)"/>
  <rect width="512" height="512" rx="118" fill="url(#zkGlow)"/>
  <rect x="6" y="6" width="500" height="500" rx="113" fill="none" stroke="#35E7C0" stroke-opacity="0.22" stroke-width="3"/>

  <!-- broadcast arcs -->
  <g stroke="url(#zkMint)" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M382 138a92 92 0 0 1 0 130" stroke-width="13"/>
    <path d="M412 108a134 134 0 0 1 0 190" stroke-width="11" opacity="0.6"/>
  </g>

  <!-- Z glyph: top bar, diagonal, bottom bar -->
  <g>
    <rect x="112" y="168" width="230" height="52" rx="26" fill="url(#zkMint)"/>
    <rect x="112" y="292" width="176" height="52" rx="26" fill="url(#zkBlue)"/>
    <path d="M300 168 L196 344" stroke="url(#zkMint)" stroke-width="52" stroke-linecap="round" fill="none" opacity="0.92"/>
  </g>

  <!-- play triangle -->
  <path d="M322 296 L372 322 L322 348 Z" fill="#F2F5FF"/>

  <!-- ZEN base bar -->
  <rect x="112" y="378" width="288" height="16" rx="8" fill="#F2F5FF" opacity="0.16"/>
</svg>
